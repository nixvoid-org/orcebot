<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<radialGradient id="bg" cx="50%" cy="40%" r="75%">
			<stop offset="0%" stop-color="#1a0f3d"/>
			<stop offset="55%" stop-color="#0a0620"/>
			<stop offset="100%" stop-color="#05030f"/>
		</radialGradient>
		<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#a78bfa"/>
			<stop offset="100%" stop-color="#22d3ee"/>
		</linearGradient>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="6" result="b"/>
			<feMerge>
				<feMergeNode in="b"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>

	<!-- starfield -->
	<g fill="#ffffff" opacity="0.8">
		<circle cx="80" cy="120" r="1.2"/>
		<circle cx="180" cy="60" r="0.8"/>
		<circle cx="240" cy="180" r="1"/>
		<circle cx="320" cy="90" r="0.6"/>
		<circle cx="420" cy="160" r="1.4"/>
		<circle cx="520" cy="50" r="0.8"/>
		<circle cx="640" cy="120" r="1"/>
		<circle cx="720" cy="200" r="0.6"/>
		<circle cx="820" cy="80" r="1.2"/>
		<circle cx="920" cy="180" r="0.8"/>
		<circle cx="1020" cy="100" r="1"/>
		<circle cx="1120" cy="160" r="0.7"/>
		<circle cx="60" cy="280" r="0.6"/>
		<circle cx="160" cy="360" r="1"/>
		<circle cx="260" cy="440" r="0.8"/>
		<circle cx="380" cy="520" r="1.2"/>
		<circle cx="480" cy="380" r="0.6"/>
		<circle cx="620" cy="500" r="0.9"/>
		<circle cx="780" cy="420" r="0.7"/>
		<circle cx="920" cy="540" r="1.1"/>
		<circle cx="1060" cy="460" r="0.8"/>
		<circle cx="1140" cy="380" r="0.6"/>
		<circle cx="100" cy="560" r="0.7"/>
		<circle cx="340" cy="290" r="0.5"/>
		<circle cx="560" cy="240" r="0.6"/>
		<circle cx="700" cy="320" r="0.5"/>
		<circle cx="860" cy="280" r="0.7"/>
	</g>

	<!-- accent dot -->
	<circle cx="100" cy="90" r="7" fill="#a78bfa" filter="url(#glow)"/>
	<text x="125" y="98" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#e7e9ff" letter-spacing="1">orcebot</text>

	<!-- planet / orb -->
	<g transform="translate(900 320)">
		<circle r="140" fill="#0e0922" opacity="0.9"/>
		<circle r="140" fill="url(#accent)" opacity="0.18"/>
		<circle cx="-50" cy="-40" r="22" fill="#ffffff" opacity="0.06"/>
		<ellipse cx="0" cy="20" rx="180" ry="22" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.55" transform="rotate(-15)"/>
	</g>

	<!-- headline -->
	<g font-family="Inter, system-ui, sans-serif" fill="#e7e9ff">
		<text x="100" y="280" font-size="22" letter-spacing="6" fill="#a78bfa" font-weight="500">ADRIFT IN THE VOID</text>
		<text x="100" y="380" font-size="84" font-weight="700" letter-spacing="-2">OrceBot</text>
		<text x="100" y="468" font-size="64" font-weight="700" letter-spacing="-1.5" fill="url(#accent)">drifts through space</text>
		<text x="100" y="540" font-size="22" fill="#8a8fb8" font-weight="400">A tiny robot, a large silence — a 3D companion from nixvoid.</text>
	</g>
</svg>
